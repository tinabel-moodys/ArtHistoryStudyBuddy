<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Art History Study</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#1b1b1f; color:#eee; margin:0; padding:1.5rem; display:flex; flex-direction:column; align-items:center; }
  .panel { background:#2a2a30; border-radius:16px; padding:1.25rem; max-width:520px; width:100%; box-sizing:border-box; box-shadow:0 4px 20px rgba(0,0,0,.4); margin-bottom:1rem; }
  img { max-width:100%; max-height:300px; border-radius:8px; margin-bottom:1rem; }
  input, select, button { font-size:.95rem; padding:.45rem .8rem; border-radius:8px; border:none; margin:.2rem; }
  input, select { background:#3a3a42; color:#eee; }
  button { background:#5a5af0; color:#fff; cursor:pointer; }
  button:hover { background:#7676ff; }
  button.sec { background:#44444c; }
  button.del { background:#a33; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:.4rem 0; border-bottom:1px solid #3a3a42; gap:.5rem; }
  .center { text-align:center; }
  .correct { color:#5af08a; font-weight:bold; }
  .wrong { color:#f05a5a; font-weight:bold; }
  .small { font-size:.8rem; opacity:.7; }
  .result { display:flex; align-items:center; gap:.5rem; padding:.3rem 0; font-size:.85rem; }
  .result img { width:48px; height:48px; object-fit:cover; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h2>Art History Study</h2>

<!-- HOME: exam list -->
<div id="home" class="panel">
  <h3 style="margin-top:0">My Exams</h3>
  <div id="examList"></div>
  <button onclick="showEditor()">+ Add Exam</button>
</div>

<!-- EDITOR -->
<div id="editor" class="panel" hidden>
  <h3 style="margin-top:0">New Exam</h3>
  <input id="exName" placeholder="Exam name (e.g. Renaissance Midterm)" style="width:94%">
  <div style="margin:.5rem 0">
    <input id="mdPath" placeholder="/path/to/exam.md" style="width:56%" onkeydown="if(event.key==='Enter') importPath()">
    <button onclick="importPath()">Import</button>
    <button class="sec" onclick="browseMd()">Browse…</button>
    <div class="small">Sections: <code>## Must Know Works</code> (<code>- Artist, Title, Date</code>) and <code>## Must Know Terms</code> (<code>- Term</code> or <code>- Term: definition</code>). Missing definitions are filled from Wikipedia.</div>
  </div>
  <h4>Must Know Works</h4>
  <input id="searchQ" placeholder="Search Met by title/artist" style="width:68%" onkeydown="if(event.key==='Enter') searchMet()">
  <button onclick="searchMet()">Search</button>
  <div id="searchResults"></div>
  <div class="small">Added (<span id="addedCount">0</span>)</div>
  <div id="addedList"></div>

  <h4>Must Know Terms</h4>
  <textarea id="exTerms" rows="5" style="width:94%;background:#3a3a42;color:#eee;border:none;border-radius:8px;padding:.5rem" placeholder="One per line:&#10;term: definition&#10;Chiaroscuro: strong light/dark contrast"></textarea>

  <h4>Random art pool (optional)</h4>
  <label class="small"><input type="checkbox" id="useFilter" onchange="$('filterFields').hidden = !this.checked"> Pull random Met art by filter</label>
  <div id="filterFields" hidden>
    <select id="exDept"><option value="">Any department</option></select><br>
    <input id="exFrom" type="number" placeholder="From year (neg = BC)" style="width:42%">
    <input id="exTo" type="number" placeholder="To year" style="width:42%"><br>
    <input id="exQ" placeholder="Keyword (optional, e.g. portrait)" style="width:94%">
  </div>

  <div style="margin-top:.8rem">
    <button onclick="saveExam()">Save Exam</button>
    <button class="sec" onclick="showHome()">Cancel</button>
  </div>
  <div id="editorMsg" class="small"></div>
</div>

<!-- STUDY -->
<div id="study" class="panel center" hidden>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <button class="sec" onclick="showHome()">&larr; Exams</button>
    <strong id="studyTitle"></strong>
    <select id="mode" onchange="nextCard()">
      <option value="flash">Flashcard</option>
      <option value="quiz">Quiz</option>
    </select>
    <select id="source" onchange="nextCard()"></select>
  </div>
  <div id="card" style="margin-top:1rem"></div>
  <div id="score" class="small">Score: 0 / 0</div>
</div>

<script>
const FAMOUS_ARTISTS = ['Leonardo da Vinci','Michelangelo','Raphael','Titian','Caravaggio','Rembrandt','Johannes Vermeer','Peter Paul Rubens','Diego Velázquez','Francisco Goya','Jacques-Louis David','J.A.D. Ingres','Eugène Delacroix','Gustave Courbet','Édouard Manet','Claude Monet','Pierre-Auguste Renoir','Edgar Degas','Paul Cézanne','Vincent van Gogh','Georges Seurat','Paul Gauguin','Henri Matisse','Pablo Picasso','Wassily Kandinsky','Gustav Klimt','Edvard Munch','Salvador Dalí','Jackson Pollock','Andy Warhol','Sandro Botticelli','Jan van Eyck','Albrecht Dürer','J.M.W. Turner','John Constable','Mary Cassatt'];
const API = 'https://collectionapi.metmuseum.org/public/collection/v1';
let exams = JSON.parse(localStorage.getItem('exams') || '[]').map(e => e.type === 'list'
  ? { name: e.name, works: e.items, terms: [], filter: null }
  : e.type === 'filter' ? { name: e.name, works: [], terms: [], filter: { deptId: e.deptId, deptName: e.deptName, from: e.from, to: e.to, q: e.q } }
  : e);
let draftItems = [];
let termSrc = {}; // term -> source URL for current draft
let activeExam = null, current = null, correct = 0, total = 0;

const $ = id => document.getElementById(id);
const save = () => localStorage.setItem('exams', JSON.stringify(exams));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function show(which) {
  ['home','editor','study'].forEach(p => $(p).hidden = p !== which);
}

function examPct(e) {
  let c = 0, t = 0;
  Object.values(e.stats || {}).forEach(x => { c += x.c; t += x.t; });
  return t ? ` · ${Math.round(100 * c / t)}% (${c}/${t})` : '';
}

function showHome() {
  show('home');
  $('examList').innerHTML = exams.length ? exams.map((e, i) => `
    <div class="row">
      <div><strong>${esc(e.name)}</strong><br><span class="small">${e.works.length} works · ${e.terms.length} terms${e.filter ? ' · random pool' : ''}${examPct(e)}</span></div>
      <div><button onclick="startExam(${i})">Study</button><button class="sec" title="Reset scores" onclick="resetStats(${i})">↺</button><button class="del" onclick="delExam(${i})">✕</button></div>
    </div>`).join('') : '<div class="small">No exams yet. Add one.</div>';
}

async function showEditor() {
  show('editor');
  draftItems = []; termSrc = {};
  $('exName').value = $('exFrom').value = $('exTo').value = $('exQ').value = $('searchQ').value = $('exTerms').value = '';
  $('useFilter').checked = false; $('filterFields').hidden = true;
  $('searchResults').innerHTML = '';
  $('editorMsg').textContent = '';
  renderAdded();
  if ($('exDept').options.length === 1) {
    try {
      const d = await (await fetch(`${API}/departments`)).json();
      d.departments.forEach(x => $('exDept').add(new Option(x.displayName, x.departmentId)));
    } catch { $('editorMsg').textContent = 'Could not load departments (offline?).'; }
  }
}

async function fetchObj(id) {
  try { return await (await fetch(`${API}/objects/${id}`)).json(); } catch { return null; }
}

async function searchMet() {
  const q = $('searchQ').value.trim();
  if (!q) return;
  $('searchResults').innerHTML = '<div class="small">Searching...</div>';
  try {
    const r = await (await fetch(`${API}/search?hasImages=true&q=${encodeURIComponent(q)}`)).json();
    const objs = (await Promise.all((r.objectIDs || []).slice(0, 10).map(fetchObj)))
      .filter(o => o && o.primaryImageSmall);
    $('searchResults').innerHTML = objs.length ? objs.map(o => `
      <div class="result">
        <img src="${esc(o.primaryImageSmall)}">
        <div style="flex:1;text-align:left">${esc(o.title)}<br><span class="small">${esc(o.artistDisplayName || 'Unknown')} · ${esc(o.objectDate)}</span></div>
        <button onclick='addItem(${JSON.stringify({id:o.objectID,title:o.title,artist:o.artistDisplayName,date:o.objectDate,img:o.primaryImageSmall,src:o.objectURL}).replace(/'/g, "&#39;")})'>Add</button>
      </div>`).join('') : '<div class="small">No results with images.</div>';
  } catch { $('searchResults').innerHTML = '<div class="small">Search failed.</div>'; }
}

const stripMd = s => s.replace(/\*\*|__|`/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\*/g, '').trim();

async function browseMd() {
  const p = await window.api.pickMd();
  if (p) { $('mdPath').value = p; importPath(); }
}

async function importPath() {
  const p = $('mdPath').value.trim();
  if (!p) return;
  let text;
  try { text = await window.api.readMd(p); }
  catch (e) { $('editorMsg').textContent = 'Cannot read file: ' + p; return; }
  importMd([text]);
}

// "Artist, Title, 1814 (p. 994)" -> {artist, title, date}
function parseWork(line) {
  let s = line.replace(/\s*\(p+\.[^)]*\)\s*$/i, '').trim();
  let date = '';
  const dm = s.match(/,\s*((?:c\.\s*)?\d{3,4}(?:\s*[-–]\s*\d{2,4})?)\s*$/i);
  if (dm) { date = dm[1]; s = s.slice(0, dm.index).trim(); }
  const i = s.indexOf(',');
  return i > 0 ? { artist: s.slice(0, i).trim(), title: s.slice(i + 1).trim(), date } : { artist: '', title: s, date };
}

async function findImage(w) {
  const sur = (w.artist.split(/\s+/).pop() || '').replace(/[^\p{L}]/gu, '').toLowerCase();
  const title = w.title.replace(/\(.*?\)/g, ' ').trim();
  try {
    const u = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=${encodeURIComponent(title + ' ' + sur)}&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
    const r = await (await fetch(u)).json();
    const pages = Object.values((r.query && r.query.pages) || {}).sort((a, b) => a.index - b.index)
      .filter(p => /\.(jpe?g|png)$/i.test(p.title) && p.imageinfo && p.imageinfo[0].thumburl);
    const pick = pages.find(p => sur && p.title.toLowerCase().includes(sur)) || pages[0];
    if (pick) return { img: pick.imageinfo[0].thumburl, src: pick.imageinfo[0].descriptionurl || '' };
  } catch {}
  try {
    const r = await (await fetch(`${API}/search?hasImages=true&q=${encodeURIComponent(title)}`)).json();
    for (const id of (r.objectIDs || []).slice(0, 5)) {
      const o = await fetchObj(id);
      if (o && o.primaryImageSmall && sur && (o.artistDisplayName || '').toLowerCase().includes(sur)) return { img: o.primaryImageSmall, src: o.objectURL || '' };
    }
  } catch {}
  return { img: '', src: '' };
}

const srcLink = u => /^https?:/.test(u || '') ? `<div class="small"><a href="${esc(u)}" target="_blank" style="color:#9aa0ff">Source ↗</a></div>` : '';

async function wikiDef(term) {
  try {
    const q = term.replace(/,\s*\d{3,4}.*$/, '');
    const s = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q + ' art history')}&srlimit=1&format=json&origin=*`)).json();
    const t = s.query.search[0].title;
    const r = await (await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`)).json();
    const sents = (r.extract || '').replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+/g) || [];
    return { def: sents.slice(0, 2).join('').trim().slice(0, 320), src: `https://en.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g, '_'))}` };
  } catch { return { def: '', src: '' }; }
}

async function importMd(texts) {
  const msg = $('editorMsg');
  const terms = [], works = [];
  for (const text of texts) {
    let sect = null;
    for (const raw of text.split('\n')) {
      const h = raw.match(/^(#{1,6})\s+(.*)/);
      if (h) {
        const t = h[2].toLowerCase();
        if (h[1] === '#' && !$('exName').value) $('exName').value = stripMd(h[2]);
        if (t.includes('term') || t.includes('phrase')) sect = 'terms';
        else if (t.includes('work')) sect = 'works';
        else if (h[1] !== '#') sect = null;
        continue;
      }
      const b = raw.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)/);
      if (!b || !sect) continue;
      const line = stripMd(b[1]);
      if (!line) continue;
      if (sect === 'terms') {
        const m = line.match(/^(.+?)\s*(?::|\s[—–-]\s)\s*(.+)$/);
        terms.push(m ? { term: m[1].trim(), def: m[2].trim() } : { term: line, def: '' });
      } else works.push(parseWork(line));
    }
  }
  for (let i = 0; i < terms.length; i++) {
    if (terms[i].def) continue;
    msg.textContent = `Defining term ${i + 1}/${terms.length}...`;
    const d = await wikiDef(terms[i].term);
    terms[i].def = d.def.replace(/\n/g, ' ');
    if (d.def) termSrc[terms[i].term] = d.src;
  }
  if (terms.length) {
    const cur = $('exTerms').value.trim();
    $('exTerms').value = (cur ? cur + '\n' : '') + terms.map(t => `${t.term}: ${t.def}`).join('\n');
  }
  const noImg = [];
  for (let i = 0; i < works.length; i++) {
    msg.textContent = `Finding image ${i + 1}/${works.length}...`;
    const w = works[i];
    const f = await findImage(w);
    if (!f.img) noImg.push(w.title);
    addItem({ id: 'md-' + w.artist + '|' + w.title, title: w.title, artist: w.artist, date: w.date, img: f.img, src: f.src });
  }
  msg.textContent = `Imported ${terms.length} terms (definitions auto-filled from Wikipedia — review!), ${works.length} works.` +
    (noImg.length ? ` No image: ${noImg.join('; ')}` : '');
}

function addItem(item) {
  if (!draftItems.some(x => x.id === item.id)) draftItems.push(item);
  renderAdded();
}
function removeItem(i) { draftItems.splice(i, 1); renderAdded(); }
function renderAdded() {
  $('addedCount').textContent = draftItems.length;
  $('addedList').innerHTML = draftItems.map((x, i) => `
    <div class="result"><img src="${esc(x.img)}"><div style="flex:1;text-align:left">${esc(x.title)}</div>
    <button class="del" onclick="removeItem(${i})">✕</button></div>`).join('');
}

function saveExam() {
  const name = $('exName').value.trim();
  if (!name) { $('editorMsg').textContent = 'Name required.'; return; }
  const terms = $('exTerms').value.split('\n').map(l => {
    const i = l.indexOf(':');
    return i > 0 ? { term: l.slice(0, i).trim(), def: l.slice(i + 1).trim() } : { term: l.trim(), def: '' };
  }).filter(t => t.term).map(t => ({ ...t, src: termSrc[t.term] || '' }));
  let filter = null;
  if ($('useFilter').checked) {
    const from = $('exFrom').value, to = $('exTo').value;
    if ((from === '') !== (to === '')) { $('editorMsg').textContent = 'Set both years or neither.'; return; }
    filter = { deptId: $('exDept').value, deptName: $('exDept').selectedOptions[0].text, from, to, q: $('exQ').value.trim() };
  }
  if (!draftItems.length && !terms.length && !filter) { $('editorMsg').textContent = 'Add works, terms, or a random pool.'; return; }
  exams.push({ name, works: draftItems, terms, filter });
  save(); showHome();
}

function delExam(i) { exams.splice(i, 1); save(); showHome(); }

function startExam(i) {
  activeExam = exams[i]; correct = total = 0; updateScore();
  $('studyTitle').textContent = activeExam.name;
  const opts = [];
  if (activeExam.works.length && activeExam.terms.length) opts.push(['mix', 'Works + Terms (mixed)']);
  if (activeExam.works.length) opts.push(['works', 'Must Know Works']);
  if (activeExam.terms.length) opts.push(['terms', 'Must Know Terms']);
  if (activeExam.filter) opts.push(['pool', 'Random Art']);
  $('source').innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('');
  show('study');
  nextCard();
}

// Pick artwork for current exam
let idCache = {};
async function pickArtwork() {
  const e = { ...activeExam.filter };
  if (kind === 'works') {
    const it = activeExam.works[Math.floor(Math.random() * activeExam.works.length)];
    return { id: it.id, title: it.title, artist: it.artist, date: it.date, img: it.img, src: it.src };
  }
  const key = JSON.stringify([e.deptId, e.from, e.to, e.q]);
  if (!idCache[key]) {
    const p = new URLSearchParams({ hasImages: 'true', q: e.q || 'art' });
    if (e.deptId) p.set('departmentId', e.deptId);
    if (e.from !== '' && e.to !== '') { p.set('dateBegin', e.from); p.set('dateEnd', e.to); }
    const r = await (await fetch(`${API}/search?${p}`)).json();
    idCache[key] = r.objectIDs || [];
  }
  const ids = idCache[key];
  if (!ids.length) return null;
  for (let t = 0; t < 8; t++) {
    const o = await fetchObj(ids[Math.floor(Math.random() * ids.length)]);
    if (o && o.primaryImageSmall && o.artistDisplayName)
      return { id: o.objectID, title: o.title, artist: o.artistDisplayName, date: o.objectDate, img: o.primaryImageSmall, src: o.objectURL };
  }
  return null;
}

async function nextCard() {
  answered = false;
  const sv = $('source').value;
  kind = sv === 'mix' ? (Math.random() < 0.5 ? 'works' : 'terms') : sv;
  $('card').innerHTML = '<div class="small">Loading...</div>';
  const quiz = $('mode').value === 'quiz';
  if (kind === 'terms') {
    const pool = quiz ? activeExam.terms.filter(x => x.def) : activeExam.terms;
    if (!pool.length) { $('card').innerHTML = '<div class="small">No terms with definitions for quiz mode.</div>'; return; }
    const t = pool[Math.floor(Math.random() * pool.length)];
    current = { term: t };
    if (quiz) {
      const others = [...new Set(activeExam.terms.map(x => x.term).filter(n => n !== t.term))].sort(() => Math.random() - 0.5).slice(0, 3);
      current.choices = [t.term, ...others].sort(() => Math.random() - 0.5);
    }
    $('card').innerHTML = quiz ? `
      <div style="margin:1rem 0">${esc(t.def)}</div><div>Which term?</div>
      <div id="choices">${current.choices.map((c, i) => `<div><button class="sec" style="width:90%" onclick="pickChoice(${i})">${esc(c)}</button></div>`).join('')}</div>
      <div id="feedback"></div><button class="sec" onclick="nextCard()">Next</button>` : `
      <h3 style="margin:1rem 0">${esc(t.term)}</h3>
      <div id="answer"><button onclick="reveal()">Show Definition</button></div>
      <div id="feedback"></div><button class="sec" onclick="nextCard()">Next</button>`;
    return;
  }
  try { current = await pickArtwork(); } catch { current = null; }
  if (!current) { $('card').innerHTML = '<div class="small">No artwork found for this exam. Edit filters or check connection.</div>'; return; }
  const mc = quiz && !!current.artist;
  if (mc) {
    const others = [...new Set([...(activeExam.works || []).map(w => w.artist), ...FAMOUS_ARTISTS].filter(a => a && a.toLowerCase() !== current.artist.toLowerCase()))].sort(() => Math.random() - 0.5).slice(0, 3);
    current.choices = [current.artist, ...others].sort(() => Math.random() - 0.5);
  }
  $('card').innerHTML = `
    ${current.img ? `<img src="${esc(current.img)}">` : `<h3>${esc(current.title)}</h3><div class="small">(no image)</div>`}
    ${mc ? `<div>Who is the artist?</div>
      <div id="choices">${current.choices.map((c, i) => `<div><button class="sec" style="width:90%" onclick="pickChoice(${i})">${esc(c)}</button></div>`).join('')}</div>`
    : `<div id="answer"><button onclick="reveal()">Show Answer</button></div>`}
    <div id="feedback"></div>
    <button class="sec" onclick="nextCard()">Next</button>`;
}

const gradeBtns = () => answered ? '' : '<div id="selfgrade"><button onclick="record(true)">Got it</button><button class="del" onclick="record(false)">Missed</button></div>';

function reveal() {
  if (current.term) { $('answer').innerHTML = esc(current.term.def || '(no definition — edit exam to add)') + srcLink(current.term.src) + gradeBtns(); return; }
  $('answer').innerHTML = `<strong>${esc(current.artist || 'Unknown')}</strong><br>${esc(current.title)}, ${esc(current.date)}` + srcLink(current.src) + gradeBtns();
}

function pickChoice(i) {
  if (answered) return;
  const right = current.term ? current.term.term : current.artist;
  const ok = current.choices[i] === right;
  const fb = $('feedback');
  fb.className = ok ? 'correct' : 'wrong';
  fb.innerHTML = (ok ? 'Correct! ' : 'Answer: ') + esc(right) +
    (current.term ? srcLink(current.term.src) : ' — ' + esc(current.title) + ', ' + esc(current.date) + srcLink(current.src));
  [...document.querySelectorAll('#choices button')].forEach((btn, j) => {
    if (current.choices[j] === right) btn.style.background = '#2a8a4a';
    else if (j === i) btn.style.background = '#a33';
  });
  record(ok);
}

let answered = false;
let kind = 'works';

function record(ok) {
  if (answered) return;
  answered = true;
  total++; if (ok) correct++;
  const src = kind;
  const st = (activeExam.stats = activeExam.stats || {});
  const x = (st[src] = st[src] || { c: 0, t: 0 });
  x.t++; if (ok) x.c++;
  save(); updateScore();
  const g = $('selfgrade'); if (g) g.remove();
}

function checkGuess() {
  if (answered) return;
  const g = $('guess').value.trim().toLowerCase();
  const fb = $('feedback');
  let ok, ans, link;
  if (current.term) {
    const t = current.term.term.toLowerCase();
    ok = !!g && (t.includes(g) || g.includes(t));
    ans = current.term.term; link = srcLink(current.term.src);
  } else {
    ok = g.length > 2 && (current.artist || '').toLowerCase().includes(g);
    ans = current.artist || 'Unknown'; link = srcLink(current.src);
  }
  fb.className = ok ? 'correct' : 'wrong';
  fb.innerHTML = (ok ? 'Correct! ' : 'Answer: ') + esc(ans) + (current.term ? '' : ' — ' + esc(current.title) + ', ' + esc(current.date)) + link;
  record(ok);
}

function updateScore() {
  const x = ((activeExam && activeExam.stats) || {})[kind];
  const pct = x && x.t ? Math.round(100 * x.c / x.t) : 0;
  $('score').textContent = 'Session: ' + correct + ' / ' + total + (x ? ' · All-time: ' + x.c + ' / ' + x.t + ' (' + pct + '%)' : '');
}

function resetStats(i) { exams[i].stats = {}; save(); showHome(); }

showHome();
</script>
</body>
</html>
